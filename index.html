/* ===== CUSTOM SECTION CSS ===== */


 * {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}
html {
  scroll-behavior: smooth;
  scroll-snap-type: y proximity;
}
body {
  background: #000;
  color: #fff;
  font-family: 'Inter',system-ui,sans-serif;
  overflow-x: hidden;
}
.snap-slide {
  scroll-snap-align: start;
  scroll-snap-stop: normal;
}
section[id] {
  scroll-margin-top: 0;
}
.liquid-glass {
  background: rgba(255,255,255,0.01);
  background-blend-mode: luminosity;
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  border: none;
  box-shadow: inset 0 1px 1px rgba(255,255,255,0.1);
  position: relative;
  overflow: hidden;
}
.liquid-glass::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: inherit;
  padding: 1.4px;
  background: linear-gradient(180deg,rgba(255,255,255,0.45) 0%,rgba(255,255,255,0.15) 20%,rgba(255,255,255,0) 40%,rgba(255,255,255,0) 60%,rgba(255,255,255,0.15) 80%,rgba(255,255,255,0.45) 100%);
  -webkit-mask: linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
  pointer-events: none;
}
.nav-link-underline {
  position: relative;
}
.nav-link-underline::after {
  content: '';
  position: absolute;
  bottom: -2px;
  left: 0;
  right: 0;
  height: 1px;
  background: currentColor;
  transform: scaleX(0);
  transform-origin: right;
  transition: transform 0.3s cubic-bezier(0.16,1,0.3,1);
}
.nav-link-underline:hover::after {
  transform: scaleX(1);
  transform-origin: left;
}
@keyframes dotPulse {
  0%,100% {
    opacity: 1;
    transform: scale(1);
  }
  50% {
    opacity: 0.45;
    transform: scale(1.45);
  }
}
.dot-pulse {
  animation: dotPulse 1.6s ease-in-out infinite;
}
@keyframes fadeInUp {
  from {
    opacity: 0;
    transform: translateY(20px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
@keyframes fadeIn {
  from {
    opacity: 0;
  }
  to {
    opacity: 1;
  }
}
::-webkit-scrollbar {

}
::-webkit-scrollbar-track {

}

/* Hallmark · genre: editorial · macrostructure: Split Studio · tone: Editorial Motion · anchor: tea-green · scope: Packaging v2 only */
/* Hallmark · pre-emit critique: P5 H5 E4 S5 R5 V5 · contrast: pass (40–41) · honest: pass (46) · chrome: pass (47) · tokens: pass (48) · mobile: pass (34,49–57) */
/* PSD/PDF 决定构图，HTML 决定时间。 */
.pkg2-section {
  --pkg2-paper: oklch(92.4% 0.018 83);
  --pkg2-paper-warm: oklch(91.7% 0.025 74);
  --pkg2-paper-pink: oklch(92% 0.024 40);
  --pkg2-ink: oklch(22% 0.015 86);
  --pkg2-copy: oklch(36% 0.012 82);
  --pkg2-muted: oklch(46% 0.012 80);
  --pkg2-rule: oklch(73% 0.018 82);
  --pkg2-green: oklch(42% 0.085 145);
  --pkg2-pink: oklch(51% 0.105 5);
  --pkg2-dark: oklch(16% 0.012 73);
  --pkg2-dark-2: oklch(19% 0.015 56);
  --pkg2-dark-rule: oklch(70% 0.012 75 / 0.2);
  --pkg2-light: oklch(91% 0.012 80);
  --pkg2-light-muted: oklch(72% 0.012 75);
  --pkg2-ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --pkg2-ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);
  --pkg2-pad: clamp(1.25rem, 5.4vw, 6.25rem);
  --pkg2-max: 106.25rem;
  position: relative;
  width: 100%;
  min-height: 0;
  overflow: clip;
  scroll-margin-top: 7.5rem;
  scroll-snap-align: none;
  background: var(--pkg2-paper);
  color: var(--pkg2-ink);
  font-family: var(--font-sans, "Noto Sans SC", sans-serif);
}

.pkg2-inner {
  width: min(100%, var(--pkg2-max));
  margin-inline: auto;
  padding-inline: var(--pkg2-pad);
}

.pkg2-kicker,
.pkg2-meta,
.pkg2-caption,
.pkg2-index,
.pkg2-keywords,
.pkg2-match-source {
  font-variant-numeric: tabular-nums;
}

.pkg2-kicker,
.pkg2-meta,
.pkg2-caption,
.pkg2-match-source {
  font-size: clamp(0.625rem, 0.72vw, 0.75rem);
  line-height: 1.35;
  letter-spacing: 0.14em;
  text-transform: uppercase;
}

.pkg2-kicker,
.pkg2-meta,
.pkg2-caption { color: var(--pkg2-muted); }

.pkg2-heading {
  margin: 0;
  font-family: var(--font-display, "Noto Serif SC", serif);
  font-size: clamp(2.35rem, 4.6vw, 5.25rem);
  font-weight: 600;
  line-height: 1.08;
  letter-spacing: -0.035em;
  overflow-wrap: anywhere;
}

.pkg2-copy {
  max-width: 37rem;
  margin: 0;
  color: var(--pkg2-copy);
  font-size: clamp(1rem, 1.05vw, 1.125rem);
  line-height: 1.8;
}

.pkg2-rule {
  width: 100%;
  height: 1px;
  background: var(--pkg2-rule);
}

.pkg2-figure { margin: 0; min-width: 0; }
.pkg2-figure img { display: block; width: 100%; height: auto; }
.pkg2-caption {
  display: flex;
  justify-content: space-between;
  gap: 1rem;
  margin-block-start: 0.8rem;
}

.pkg2-reveal { opacity: 1; transform: none; }
.pkg2-motion-ready .pkg2-reveal {
  opacity: 0;
  transform: translateY(1.25rem);
  transition: opacity 700ms var(--pkg2-ease-out), transform 700ms var(--pkg2-ease-out);
  transition-delay: var(--pkg2-delay, 0ms);
}
.pkg2-motion-ready .pkg2-reveal.is-visible { opacity: 1; transform: none; }

.pkg2-motion-ready .pkg2-mask-left,
.pkg2-motion-ready .pkg2-mask-right,
.pkg2-motion-ready .pkg2-mask-down {
  opacity: 1;
  transform: none;
  transition: clip-path 1000ms var(--pkg2-ease-out);
  transition-delay: var(--pkg2-delay, 0ms);
}
.pkg2-motion-ready .pkg2-mask-left { clip-path: inset(0 100% 0 0); }
.pkg2-motion-ready .pkg2-mask-right { clip-path: inset(0 0 0 100%); }
.pkg2-motion-ready .pkg2-mask-down { clip-path: inset(0 0 100% 0); }
.pkg2-motion-ready .pkg2-mask-left.is-visible,
.pkg2-motion-ready .pkg2-mask-right.is-visible,
.pkg2-motion-ready .pkg2-mask-down.is-visible { clip-path: inset(0); }

/* 01 · Project visual */
.pkg2-hero { padding-block: clamp(8.5rem, 11vw, 11.5rem) clamp(7.5rem, 11vw, 11rem); }

  display: flex;

.pkg2-hero-green img,
.pkg2-hero-pink img { object-fit: contain; }
.pkg2-hero-breathe { transform-origin: 58% 48%; }

@keyframes pkg2-hero-breathe { from { transform: scale(0.99); } to { transform: scale(1); } }

/* Shared section heads */
.pkg2-section-head {
  display: grid;
  gap: 1.25rem;
  padding-block-end: clamp(3rem, 6vw, 6rem);
}

.pkg2-language {

.pkg2-source-stack figure:first-child { margin-block-end: clamp(2rem, 6vw, 6rem); }
.pkg2-source-stack img { max-height: 25rem; object-fit: contain; }

.poster-case__copy {

}

  font-weight: 500;

}

.poster-case__meta::after {

  background: var(--poster-line);
}

.poster-case__title {

  width: min(96%, 1640px);

  min-width: 0;
  margin: 0;

function usePackagingMotion(rootRef) {
  useEffect(function() {
    var root = rootRef.current;
    var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (!root || reduceMotion || !('IntersectionObserver' in window)) return;

    root.classList.add('pkg-motion-ready');
    var revealNodes = Array.prototype.slice.call(root.querySelectorAll('.pkg-reveal, .pkg-scroll-reveal'));
    var revealObserver = new IntersectionObserver(function(entries) {
      entries.forEach(function(entry) {
        if (!entry.isIntersecting) return;
        entry.target.classList.add('is-revealed');
        revealObserver.unobserve(entry.target);
      });
    }, { threshold: 0.12, rootMargin: '0px 0px -8% 0px' });
    revealNodes.forEach(function(node) { revealObserver.observe(node); });

    var breatheNodes = Array.prototype.slice.call(root.querySelectorAll('.pkg-breathe-frame'));
    var breatheObserver = new IntersectionObserver(function(entries) {
      entries.forEach(function(entry) {
        entry.target.dataset.pkgVisible = entry.isIntersecting ? 'true' : 'false';
        entry.target.classList.toggle('is-live', entry.isIntersecting && !document.hidden);
      });
    }, { threshold: 0.32, rootMargin: '-8% 0px -8% 0px' });
    breatheNodes.forEach(function(node) { breatheObserver.observe(node); });

    var sectionVisible = false;
    var sectionObserver = new IntersectionObserver(function(entries) {
      entries.forEach(function(entry) {
        sectionVisible = entry.isIntersecting;
        root.classList.toggle('pkg-active', sectionVisible && !document.hidden);
      });
    }, { threshold: 0.04 });
    sectionObserver.observe(root);

    function syncVisibility() {
      root.classList.toggle('pkg-active', sectionVisible && !document.hidden);
      breatheNodes.forEach(function(node) {
        node.classList.toggle('is-live', node.dataset.pkgVisible === 'true' && !document.hidden);
      });
    }
    document.addEventListener('visibilitychange', syncVisibility);

    return function() {
      revealObserver.disconnect();
      breatheObserver.disconnect();
      sectionObserver.disconnect();
      document.removeEventListener('visibilitychange', syncVisibility);
      root.classList.remove('pkg-motion-ready', 'pkg-active');
      breatheNodes.forEach(function(node) {
        node.classList.remove('is-live');
        delete node.dataset.pkgVisible;
      });
    };
  }, []);
}

    if (!root || reduceMotion || !('IntersectionObserver' in window)) return;

    var timer = null;

function usePackagingV2Motion(rootRef) {

        var groupedMasks = maskGroups.get(entry.target);
        if (groupedMasks) {

        } else {
          entry.target.classList.add('is-visible');
        }
        observer.unobserve(entry.target);

/* ---------- Visual Design / Poster exhibition ---------- */
var posterAssetRoot = 'poster-assets/';

function usePosterSectionMotion(sectionRef) {
  useLayoutEffect(function() {
    var root = sectionRef.current;
    if (!root) return;
    var items = Array.from(root.querySelectorAll('.poster-case__reveal'));
    var reducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    if (reducedMotion || !('IntersectionObserver' in window)) {
      items.forEach(function(item) { item.classList.add('is-visible'); });
      return;
    }

    root.classList.add('poster-motion-ready');
    var observer = new IntersectionObserver(function(entries) {
      entries.forEach(function(entry) {
        if (!entry.isIntersecting) return;
        entry.target.classList.add('is-visible');
        observer.unobserve(entry.target);
      });
    }, { threshold: 0.08, rootMargin: '0px 0px -10% 0px' });

    items.forEach(function(item) { observer.observe(item); });
    return function() { observer.disconnect(); };
  }, []);
}

function usePosterVideoPlayback(sectionRef) {
  useEffect(function() {
    var root = sectionRef.current;
    if (!root || !('IntersectionObserver' in window)) return;
    var videos = Array.from(root.querySelectorAll('video'));
    if (!videos.length) return;

    function playVideo(video) {
      video.muted = true;
      var playAttempt = video.play();
      if (playAttempt && typeof playAttempt.catch === 'function') {
        playAttempt.catch(function() {});
      }
    }

    var observer = new IntersectionObserver(function(entries) {
      entries.forEach(function(entry) {
        var video = entry.target;
        video.dataset.posterNear = entry.isIntersecting ? 'true' : 'false';
        if (entry.isIntersecting && !document.hidden) playVideo(video);
        else video.pause();
      });
    }, { threshold: 0.01, rootMargin: '280px 0px 280px 0px' });

    videos.forEach(function(video) {
      video.muted = true;
      observer.observe(video);
    });

    function handleVisibility() {
      videos.forEach(function(video) {
        if (document.hidden || video.dataset.posterNear !== 'true') video.pause();
        else playVideo(video);
      });
    }

    document.addEventListener('visibilitychange', handleVisibility);
    return function() {
      observer.disconnect();
      document.removeEventListener('visibilitychange', handleVisibility);
      videos.forEach(function(video) { video.pause(); });
    };
  }, []);
}
